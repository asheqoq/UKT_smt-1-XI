<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Manajemen Peminjaman</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-6">
    <nav class="mb-6 flex gap-4 bg-white p-4 rounded shadow max-w-5xl mx-auto">
      <a href="kategori_alat.html" class="text-gray-600 hover:text-blue-600">Kategori</a>
      <a href="alat.html" class="text-gray-600 hover:text-blue-600">Alat</a>
      <a href="peminjaman.html" class="font-bold text-blue-600">Peminjaman</a>
    </nav>

    <div class="max-w-5xl mx-auto bg-white p-6 rounded shadow">
      <h2 class="text-xl font-bold mb-4">Form Peminjaman</h2>
      <form id="formPeminjaman" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <div>
          <label class="block text-sm font-medium mb-1">Nama Peminjam</label>
          <input type="text" id="nama_peminjam" required class="border p-2 rounded w-full"/>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Kelas</label>
          <input type="text" id="kelas" class="border p-2 rounded w-full" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Alat</label>
          <select id="id_alat" required class="border p-2 rounded w-full">
            <option value="">-- Pilih Alat --</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Jumlah</label>
          <input type="number" id="jumlah" min="1" value="1" required class="border p-2 rounded w-full"/>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Tanggal Pinjam</label>
          <input type="date" id="tanggal_pinjam" required class="border p-2 rounded w-full"/>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Status</label>
          <select id="status" required class="border p-2 rounded w-full">
            <option value="Dipinjam">Dipinjam</option>
            <option value="Dikembalikan">Dikembalikan</option>
            <option value="Terlambat">Terlambat</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">
            Tambah Peminjaman
          </button>
        </div>
      </form>

      <table class="w-full border-collapse border">
        <thead>
          <tr class="bg-gray-200">
            <th class="border p-2">No</th>
            <th class="border p-2">Peminjam</th>
            <th class="border p-2">Alat</th>
            <th class="border p-2">Tanggal</th>
            <th class="border p-2">Status</th>
            <th class="border p-2">Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelPeminjaman"></tbody>
      </table>
    </div>
    <script src="js/peminjaman.js"></script>
  </body>
</html>
