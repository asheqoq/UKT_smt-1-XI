<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Manajemen Alat</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 p-6">
    <nav class="mb-6 flex gap-4 bg-white p-4 rounded shadow max-w-5xl mx-auto">
      <a href="kategori_alat.html" class="text-gray-600 hover:text-blue-600">Kategori</a>
      <a href="alat.html" class="font-bold text-blue-600">Alat</a>
      <a href="peminjaman.html" class="text-gray-600 hover:text-blue-600">Peminjaman</a>
    </nav>

    <div class="max-w-5xl mx-auto bg-white p-6 rounded shadow">
      <h2 class="text-xl font-bold mb-4">Form Data Alat</h2>
      <form id="formAlat" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <input type="hidden" id="id_alat" />

        <div>
          <label class="block text-sm font-medium mb-1">Nama Alat</label>
          <input type="text" id="nama_alat" required class="border p-2 rounded w-full"/>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Kategori</label>
          <select id="id_kategori" required class="border p-2 rounded w-full">
            <option value="">-- Pilih Kategori --</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Kondisi</label>
          <select id="kondisi" required class="border p-2 rounded w-full">
            <option value="baik">Baik</option>
            <option value="kurang baik">Kurang Baik</option>
            <option value="buruk">Buruk</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Stok</label>
          <input type="number" id="stok" min="0" required class="border p-2 rounded w-full"/>
        </div>

        <div class="md:col-span-2 flex gap-2">
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">
            Simpan
          </button>
          <button type="button" onclick="resetForm()" class="bg-gray-400 text-white px-4 py-2 rounded">
            Batal
          </button>
        </div>
      </form>

      <table class="w-full border-collapse border">
        <thead>
          <tr class="bg-gray-200">
            <th class="border p-2">No</th>
            <th class="border p-2">Nama Alat</th>
            <th class="border p-2">Kategori</th>
            <th class="border p-2">Kondisi</th>
            <th class="border p-2">Stok</th>
            <th class="border p-2">Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelAlat"></tbody>
      </table>
    </div>
    <script src="js/alat.js"></script>
  </body>
</html>
