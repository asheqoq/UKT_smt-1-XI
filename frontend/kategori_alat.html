<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <!-- <link rel="stylesheet" href="dist/output.css"> -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-200 text-gray-800 font-sans antialiased">
    <header class="bg-gray-50 shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center px-6 py-4">
    <h1 class="text-2xl font-bold">Sistem Peminjaman ALat</h1>
      <nav id="navbar">
          <ul>
              <li class="flex gap-6">
                  <a href="alat.html" class="hover:text-black text-sky-700 hover:bg-sky-600 p-1 rounded-xl transition-all duration-300 font-bold">Alat</a>
                  <a href="kategori_alat.html" class="text-black hover:bg-sky-600 bg-gray-200 p-1 rounded-xl transition-all duration-300 font-bold">Kategori</a>
                  <a href="peminjaman.html" class="hover:text-black text-sky-700 hover:bg-sky-600 p-1 rounded-xl transition-all duration-300 font-bold">Peminjaman</a>
              </li>
          </ul>
      </nav>
    </div>
    </header>

    <section id="kategori" class="mb-8 px-4">
    <div class="mb-4 flex items-center justify-between mt-10">
      <div>
        <h2 class="text-xl font-bold">Kelola Kategori</h2>
        <p class="mt-1 text-md text-gray-400">
          Daftar Kategori
        </p>
      </div>
      <button type="button"
        class="rounded-lg bg-blue-500 px-4 py-2 font-bold text-6 text-white transition duration-300 hover:bg-blue-600">
        + Tambah Kategori
      </button>
    </div>

    <div class="mb-6 overflow-x-auto rounded-lg bg-white shadow-sm">
    <table class="table-alat w-full border-collapse bg-white shadow-sm">
      <thead class="bg-gray-300 text-xs uppercase font-bold text-gray-700">
        <tr>
          <th class="border border-gray-400 px-4 py-3">Id kategori</th>
          <th class="border border-gray-400 px-4 py-3">Nama Kategori</th>
          <th class="border border-gray-400 px-4 py-3">deskripsi</th>
      </thead>

      <tbody id="kategori-list" class="divide-y divide-gray-100">
        <tr>
          <td colspan="4" class="py-4 px-6 text-center text-gray-500">Memuat data produk...</td>
        </tr>
      </tbody>

    </div>
  </section>

  <section id="tambah" class="mb-8 px-4">
      <div class="mb-5">
        <h1 class="text-xl font-bold">Tambah Kategori</h1>
      </div>

      <form id="formProduk" class="bg-white rounded-xl shadow-sm p-6 max-w-md mb-6">
          <div class="mb-4">
            <label class="block font-semibold text-gray-700 mb-1">Nama Kategori</label>
            <input type="text" id="nama_kategori" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
          </div>
          <div class="mb-4">
            <label class="block font-semibold text-gray-700 mb-1">Deskripsi</label>
            <input type="text" id="nama_kategori" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
          </div>

          <button type="submit"
            class="text-white bg-sky-700 hover:bg-sky-500 font-bold text-sm px-6 py-2 rounded-lg transition duration-300">
            Tambah
          </button>
          <button type="reset"
            class="text-white bg-sky-700 hover:bg-sky-500 font-bold text-sm px-6 py-2 rounded-lg transition duration-300">
            Reset
          </button>
      </form>
    </section>

<script src="js/kategori_alat.js"></script>
</body>
</html>
